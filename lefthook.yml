# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      run: |
        files=$(printf '%s\n' {staged_files} | rg -v '(^apps/web/src/routeTree\.gen\.ts$|(^|/)_generated/|\.gen\.(ts|tsx|js|jsx|d\.ts)$)' || true)
        [ -z "$files" ] || bun oxlint --fix $files
      stage_fixed: true
    - name: oxfmt
      run: |
        files=$(printf '%s\n' {staged_files} | rg -v '(^apps/web/src/routeTree\.gen\.ts$|(^|/)_generated/|\.gen\.(ts|tsx|js|jsx|d\.ts)$)' || true)
        [ -z "$files" ] || bun oxfmt --write $files
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
